[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-trade-helper"
version = "0.1.0"
description = "A safety-first personal market analysis assistant for market data and trade planning"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.10.6",
  "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.27.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
